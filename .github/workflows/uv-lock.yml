name: Resolve uv lockfile

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/uv-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uv-lock-main
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Resolve dependencies
        run: uv lock

      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- uv.lock)" ]; then
            echo "uv.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Add resolved uv lockfile [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main